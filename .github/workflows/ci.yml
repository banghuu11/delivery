name: .NET Core CI & Build Validation

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build-and-test:
    name: Build & Verify Solution
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Setup .NET SDK 8.0
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore Dependencies
      run: dotnet restore DeliveryManagement.sln

    - name: Build Solution (Release Mode)
      run: dotnet build DeliveryManagement.sln --configuration Release --no-restore

    - name: Validate Branch Name (on Pull Requests)
      if: github.event_name == 'pull_request'
      run: |
        BRANCH_NAME="${{ github.head_ref }}"
        echo "Validating PR branch name: $BRANCH_NAME"
        if echo "$BRANCH_NAME" | grep -qE '^(main|develop)$'; then
          echo "Base branch detected."
          exit 0
        fi
        BRANCH_PATTERN="^(feature|bugfix|hotfix|release|refactor|docs|ci)\/[a-zA-Z0-9_.-]+$"
        if ! echo "$BRANCH_NAME" | grep -qE "$BRANCH_PATTERN"; then
          echo "::error::Branch name '$BRANCH_NAME' is invalid! Must follow pattern: feature/*, bugfix/*, hotfix/*, release/*, refactor/*, docs/*, ci/*"
          exit 1
        fi
        echo "Branch name is valid."

    - name: Validate Commit Messages (Conventional Commits)
      run: |
        echo "Validating latest commit message format..."
        COMMIT_MSG=$(git log -1 --pretty=%B)
        echo "Commit message: $COMMIT_MSG"
        
        # Skip merge/revert commits
        if echo "$COMMIT_MSG" | grep -qE '^(Merge|Revert) '; then
          echo "Merge/Revert commit detected. Skipping check."
          exit 0
        fi
        
        PATTERN="^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-zA-Z0-9_\.\/-]+\))?: .+"
        if ! echo "$COMMIT_MSG" | grep -qE "$PATTERN"; then
          echo "::error::Commit message does not follow Conventional Commits format! (e.g. feat(order): add create order)"
          exit 1
        fi
        echo "Commit message follows Conventional Commits standard."

    - name: Verify Dockerfile Build
      run: |
        docker build -t delivery-management-webapp:ci -f DeliveryManagement/Dockerfile DeliveryManagement

